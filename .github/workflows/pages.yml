# Tanıtım ve indirme sayfası (site/) GitHub Pages'e yüklenir: https://underday.github.io/Praat-turkish/
# İndirme düğmesi son Release'i sayfa açılırken GitHub'dan okur, yeni sürümde sayfayı yeniden yayımlamak gerekmez.
name: Sayfa

on:
  push:
    branches: [ main ]
    paths: [ "site/**", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Yükleme ve yayın ayrı işlerde: aynı işte arka arkaya koşunca yayın adımı
  # yeni yüklenen dosyaları henüz göremeyip "No artifacts" hatası verebiliyor.
  hazirla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Kaynak sayfada doctype ve head etiketleri yok. Pages için başına ekle.
      - name: Sayfa başlığını ekle
        run: sed -i '1i <!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  yayimla:
    needs: hazirla
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
