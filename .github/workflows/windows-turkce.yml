# Praat Türkçe arayüz, Windows x64 derlemesi.
# Elle tetiklenir (Actions > Windows Türkçe derleme > Run workflow, iş akışı varsayılan dalda olmalı)
# ya da "windows-" ile başlayan bir etiket push edilince çalışır (git tag windows-v1 && git push origin windows-v1).
# Private depoda her çalıştırma Windows dakikası harcar.
name: Windows Türkçe derleme

on:
  workflow_dispatch:
  push:
    tags: [ "windows-*" ]

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Depoyu al
      uses: actions/checkout@v4

    # UCRT64: GCC ve libstdc++ (yerel MinGW derlemesiyle aynı kütüphane) + UCRT (Praat'ın resmî derlemesi gibi).
    # CLANG64 (libc++) ile Praat'ın bazı dosyaları <vector> başlığını dolaylı bulamıyor.
    - name: MSYS2 (ucrt64) kur
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          make
          zip
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-zlib

    - name: Derle
      # MinGW'nin kendi printf/scanf sürümü: Praat açılışta %td biçimini denetler,
      # bu bayrakla denetim Windows'un ya da Wine'ın C kütüphanesine bağlı kalmaz.
      run: make PRAAT_COMPILER=gcc PRAAT_ARCH=x64v1 CC="gcc -D__USE_MINGW_ANSI_STDIO=1" CXX="g++ -D__USE_MINGW_ANSI_STDIO=1" -j4

    - name: Paketle
      run: |
        SURUM=$(grep -m1 'PRAAT_VERSION_STR' main/main_Praat.h | awk '{print $3}')
        AD="Praat-tr-$SURUM-win-x64"
        mkdir -p "dagitim/$AD"
        cp Praat.exe ceviri/ceviri_tr.tsv ceviri/windows/BENIOKU.txt "dagitim/$AD/"
        echo "AD=$AD" >> "$GITHUB_ENV"

    - name: Yükle
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.AD }}
        path: dagitim/${{ env.AD }}

    # Zip önce yüklenir, sınama düşerse bile indirilebilir kalır (çalıştırma kırmızı görünür).
    - name: Sınama (script modunda açılış, açılış denetimleri dahil)
      run: |
        printf 'writeInfoLine: 2 + 2\n' > sinama.praat
        ./Praat.exe --run sinama.praat | tee sinama.txt
        grep -q 4 sinama.txt
